# =============================================================================
# Caller — sec-pipeline-scan.yml@v3.5.0
# =============================================================================
# Destino: repositorio OpenBanking-Brasil/mqd-client
# Caminho no repositorio: .github/workflows/sec-pipeline-scan.yml
#
# Primeira execucao da pipeline de seguranca contra este repositorio.
# Disparo MANUAL de proposito: workflow_dispatch apenas, sem gatilho por push
# ou pull_request. Ver docs/ADOPTION-GUIDE.md (repositorio
# sonarqube-terragrunt-production), secao 5 - Primeira Execucao: Modo Seguro.
#
# Motivo de nao usar gatilho automatico na validacao: a pipeline pode abrir
# ticket no Jira, e o projeto de destino (EDP) e real. Um gatilho por push
# durante o ajuste geraria ticket a cada commit. Adicionar push/pull_request
# depois que o comportamento estiver confirmado, seguindo o mesmo padrao
# adotado no ofc-client (pull_request contra develop).
#
# mqd-client e projeto Go puro (ver src/go.mod): sem package.json nem
# dependencia privada em GitHub Packages, portanto sem necessidade de
# permissao packages: read. O dependency-check ainda roda, mas com cobertura
# reduzida por ser voltado a manifestos Node/JS (comportamento esperado, ver
# ADOPTION-GUIDE.md secao 6).
#
# Dockerfile do repositorio: infra/dockerfile/dockerfile-minimal. Informado
# via dockerfile-path para o job scan buildar a imagem localmente e entregar
# ao Dockle. Sem isso o Dockle terminaria SKIPPED e nenhum achado CONTAINER
# seria gerado.
#
# POR QUE ESTE ARQUIVO PRECISA EXISTIR EM main, mesmo sem nenhuma execucao
# pretendida contra ela ainda: o GitHub só disponibiliza workflow_dispatch via
# API/CLI (gh workflow run) quando o arquivo do workflow existe na branch
# default do repositorio — e uma exigencia da plataforma, nao op cional. A
# guarda `if` no job abaixo impede a execucao real quando o ref disparado for
# main, entao a presenca do arquivo aqui NAO habilita scan nem ticket contra
# main: serve apenas para o disparo remoto funcionar contra outras branches
# (ex.: --ref beta-2.3.3-validate).
# =============================================================================

name: Security Scan

on:
  workflow_dispatch:
    inputs:
      create-tickets:
        description: 'Abrir ticket de seguranca no Jira'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  security:
    # Guarda de seguranca: nunca executar contra a branch main, mesmo se
    # disparado (por engano ou por --ref omitido) sem especificar outra
    # branch. O arquivo existe em main so para o workflow_dispatch remoto
    # funcionar (ver nota acima) — a execucao real do scan so acontece
    # quando o ref disparado for diferente de main.
    if: github.ref_name != 'main'
    uses: OpenBanking-Brasil/ofb-pipelines/.github/workflows/sec-pipeline-scan.yml@v3.5.0
    with:
      # Unico Dockerfile do repositorio. Sem isto o Dockle sai SKIPPED.
      dockerfile-path: 'infra/dockerfile/dockerfile-minimal'
      # Bucket dedicado dos documentos canonicos. A gravacao no prefixo
      # canonical/ e o que dispara a funcao de ingestao no banco.
      findings-bucket: 'security-findings-808999394981-us-east-2'

      # Na PRIMEIRA execucao, manter false: valida scanners, relatorio e
      # SonarQube sem tocar no Jira. Depois executar novamente com true para
      # validar a abertura de ticket isoladamente.
      create-security-tickets: ${{ inputs.create-tickets }}

      # Destino e tipo herdados do Secrets Manager: SEC_JIRA_PROJECT_KEY e
      # SEC_JIRA_ISSUE_TYPE. Nao declarar aqui mantem a troca centralizada no
      # segredo, sem editar este arquivo.

      # CRITICAL,HIGH e nao ANY: ANY selecionava a maioria dos achados em
      # outras validacoes e tornava o corpo do ticket inutil para priorizar
      # (mais itens omitidos por tamanho do que listados). A lista completa
      # vive no SonarQube e no modelo canonico, ambos linkados no ticket.
      ticket-severity-threshold: 'CRITICAL,HIGH'

    secrets: inherit
